# The four-laptop setup emulated on one laptop (scripts/cluster/emulate.sh):
# every machine is a network namespace m-NAME on a bridge. Same CPUs and
# workload as the namespace testbed, so numbers are roughly comparable. Only
# for testing bench/cluster.py; see docs/cluster-runbook.md.

TRANSPORT=netns
REPO=.                        # (emulation: this checkout)
CLIENT=client
LB=lb
VIP=10.2.0.1
BACKEND_PORT=8080
METRICS_PORT=9100
ENCAP_PORT=7700
LOADGEN_CPUS=2,3,4,5
VIP_ROUTE_MTU=1460
COST_MS=1
SLO_P99_MS=20
CONNS=512
LONG_LIVED_CONNS=100
LONG_LIVED_RATE=200

host    client  192.168.77.10  wlan0   0,1
host    lb      192.168.77.11  wlan0   0,1
host    h1      192.168.77.12  wlan0   0,1
host    h2      192.168.77.13  wlan0   0,1

backend beP1    h1       10.11.1.11   8,10    P   1.6
backend beP2    h1       10.11.1.12   12,14   P
backend beE1    h2       10.11.2.13   16-19   E
backend beE2    h2       10.11.2.14   20-23   E
